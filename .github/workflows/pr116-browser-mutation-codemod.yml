name: PR116 Browser Mutation Codemod

on:
  push:
    branches:
      - fix/final-production-professional-closeout
    paths:
      - scripts/pr116-browser-mutation-codemod.mjs
      - scripts/pr116-browser-mutation-codemod-v2.mjs
      - scripts/pr116-browser-mutation-codemod-v3.mjs
      - .github/workflows/pr116-browser-mutation-codemod.yml

permissions:
  contents: write

concurrency:
  group: pr116-browser-mutation-codemod
  cancel-in-progress: false

jobs:
  codemod:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-production-professional-closeout
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Rewrite browser Admin mutations through typed boundary
        run: node scripts/pr116-browser-mutation-codemod-v3.mjs
      - name: Focused boundary validation
        run: |
          npm run typecheck
          npm run verify:admin-mutations
      - name: Commit deterministic boundary rewrite
        run: |
          rm -f scripts/pr116-browser-mutation-codemod.mjs scripts/pr116-browser-mutation-codemod-v2.mjs scripts/pr116-browser-mutation-codemod-v3.mjs .github/workflows/pr116-browser-mutation-codemod.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "refactor(security): route browser admin mutations through typed boundary"
          git push origin HEAD:fix/final-production-professional-closeout
