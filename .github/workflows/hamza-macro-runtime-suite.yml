name: HAMZA Macro Runtime Suite

on:
  workflow_call:
    inputs:
      suite: { required: true, type: string }
      expected_sha: { required: true, type: string }

permissions:
  contents: read

jobs:
  macro-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: macro-${{ inputs.suite }}-${{ inputs.expected_sha }}
      cancel-in-progress: false
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      CLOSEOUT_EXECUTION_MODE: local-isolated
      CLOSEOUT_SUITE: ${{ inputs.suite }}
      CLOSEOUT_TARGET_URL: https://127.0.0.1:3443
      CLOSEOUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
      CLOSEOUT_ACTUAL_SHA: ${{ inputs.expected_sha }}
      CLOSEOUT_STATEFUL: "true"
      CLOSEOUT_SUPABASE_URL: http://127.0.0.1:54321
      CLOSEOUT_AUTH_URL: http://127.0.0.1:54321/auth/v1
      CLOSEOUT_PORTAL_FIXTURE_FILE: /tmp/hamza-portal-fixtures.json
      CLOSEOUT_WORKDIR: /tmp/hamza-macro-runtime
      NEXT_PUBLIC_SITE_URL: https://127.0.0.1:3443
      SESSION_HASH_KEY: closeout-local-only-session-hash-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
      - name: Assert exact safe dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ inputs.expected_sha }}'
          case '${{ inputs.suite }}' in commerce|tasks|sla|workflows) ;; *) exit 2 ;; esac
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${HAMZA_PRODUCTION_READONLY_URL:-}"
          node scripts/closeout/environment-guard.mjs
          test -f "e2e/closeout/${{ inputs.suite }}.spec.mjs"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies and local tools
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          docker info >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          npm install --prefix tools/pr101-local-e2e --no-audit --no-fund
          cli="$GITHUB_WORKSPACE/tools/pr101-local-e2e/node_modules/.bin/supabase"
          test "$($cli --version)" = "2.109.1"
          echo "SUPABASE_BIN=$cli" >> "$GITHUB_ENV"
      - name: Build isolated project and dependency-safe snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CLOSEOUT_WORKDIR"
          mkdir -p "$CLOSEOUT_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$CLOSEOUT_WORKDIR/supabase/config.toml"
          printf '%s\n' '-- Run-scoped fixtures are created after reset.' > "$CLOSEOUT_WORKDIR/supabase/seed.sql"
          cat scripts/closeout/build-current-state-apply.part{00,01,02,03} | base64 -d | gzip -d > /tmp/build-current-state-apply.mjs
          snapshot="$GITHUB_WORKSPACE/supabase/current-state-schema/current-state-schema.sql"
          test "$(wc -c < "$snapshot" | tr -d '[:space:]')" = "496138"
          printf '%s  %s\n' '3b1890376e3cca966b1dce0979dd2ed089f95237e1067febf4f58e8f1bf776f2' "$snapshot" | sha256sum -c -
          test "$(git hash-object "$snapshot")" = "65f45c04f7bd50e7751eb5f802f3ad0550c52bfc"
          node /tmp/build-current-state-apply.mjs "$snapshot" /tmp/current-state-schema.apply.sql
      - name: Start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          cd "$CLOSEOUT_WORKDIR"
          "$SUPABASE_BIN" start --exclude studio,imgproxy >/tmp/macro-supabase-start.log 2>&1
          "$SUPABASE_BIN" status -o env >/tmp/macro-supabase.env
          chmod 600 /tmp/macro-supabase.env
          cd "$GITHUB_WORKSPACE"
          while IFS='=' read -r key value; do
            value="${value%\"}"; value="${value#\"}"
            [ -n "$value" ] && echo "::add-mask::$value"
            case "$key" in
              API_URL) echo "API_URL=$value" >> "$GITHUB_ENV"; echo "NEXT_PUBLIC_SUPABASE_URL=https://127.0.0.1:3443/__closeout_supabase" >> "$GITHUB_ENV" ;;
              ANON_KEY) echo "ANON_KEY=$value" >> "$GITHUB_ENV"; echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$value" >> "$GITHUB_ENV" ;;
              SERVICE_ROLE_KEY) echo "SERVICE_ROLE_KEY=$value" >> "$GITHUB_ENV" ;;
              DB_URL) echo "DB_URL=$value" >> "$GITHUB_ENV" ;;
            esac
          done < /tmp/macro-supabase.env
      - name: Apply authoritative snapshot and additive macro migrations
        shell: bash
        run: |
          set -euo pipefail
          set -a; . /tmp/macro-supabase.env; set +a
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f /tmp/current-state-schema.apply.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260803003000_pr105_macro_runtime_completion.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260803004000_pr105_macro_runtime_hardening.sql
          node scripts/closeout/portal-local-fixtures.mjs setup
          node scripts/closeout/macro-runtime-fixtures.mjs setup
      - name: Build and start local HTTPS application
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          mkdir -p /tmp/hamza-closeout-tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/hamza-closeout-tls/key.pem -out /tmp/hamza-closeout-tls/cert.pem -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost'
          npm run start >/tmp/hamza-closeout-next.log 2>&1 & echo $! >/tmp/hamza-closeout-next.pid
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 2; done
          CLOSEOUT_TLS_KEY=/tmp/hamza-closeout-tls/key.pem CLOSEOUT_TLS_CERT=/tmp/hamza-closeout-tls/cert.pem CLOSEOUT_UPSTREAM_URL=http://127.0.0.1:3000 CLOSEOUT_SUPABASE_UPSTREAM_URL=http://127.0.0.1:54321 CLOSEOUT_HTTPS_PORT=3443 node scripts/closeout/local-https-proxy.mjs >/tmp/hamza-closeout-proxy.log 2>&1 & echo $! >/tmp/hamza-closeout-proxy.pid
          for i in {1..40}; do curl -kfsS https://127.0.0.1:3443/__closeout_supabase/auth/v1/settings >/dev/null && break; sleep 2; done
      - name: Run authenticated real suite
        id: playwright
        continue-on-error: true
        shell: bash
        run: |
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test --config=playwright.closeout.config.mjs
      - name: Validate and sanitize evidence
        id: validate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          node scripts/closeout/validate-results.mjs artifacts/raw/results.json '${{ inputs.suite }}'
          mkdir -p artifacts/raw
          printf '# Macro runtime\n- Suite: `%s`\n- Head: `%s`\n' '${{ inputs.suite }}' '${{ inputs.expected_sha }}' > artifacts/raw/failure-summary.md
          node scripts/closeout/sanitize-artifacts.mjs artifacts/raw artifacts/safe/reports
          node scripts/closeout/scan-safe-artifacts.mjs artifacts/safe
      - name: Upload sanitized evidence
        if: always() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: macro-${{ inputs.suite }}-${{ inputs.expected_sha }}
          path: artifacts/safe
          if-no-files-found: error
          retention-days: 14
      - name: Always cleanup and prove zero fixtures
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/macro-supabase.env ] && [ -f "$CLOSEOUT_PORTAL_FIXTURE_FILE" ]; then
            set -a; . /tmp/macro-supabase.env; set +a
            node scripts/closeout/macro-runtime-fixtures.mjs cleanup
            node scripts/closeout/portal-local-fixtures.mjs cleanup
          fi
          [ -f /tmp/hamza-closeout-next.pid ] && kill "$(cat /tmp/hamza-closeout-next.pid)" 2>/dev/null
          [ -f /tmp/hamza-closeout-proxy.pid ] && kill "$(cat /tmp/hamza-closeout-proxy.pid)" 2>/dev/null
          if [ -d "$CLOSEOUT_WORKDIR" ] && [ -n "${SUPABASE_BIN:-}" ]; then cd "$CLOSEOUT_WORKDIR" && "$SUPABASE_BIN" stop --no-backup >/dev/null 2>&1; fi
          cd "$GITHUB_WORKSPACE"
          rm -rf "$CLOSEOUT_WORKDIR" artifacts/raw /tmp/hamza-closeout-* /tmp/macro-* /tmp/current-state-schema.apply.sql /tmp/build-current-state-apply.mjs "$CLOSEOUT_PORTAL_FIXTURE_FILE" supabase/.temp
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Preserve conclusion
        if: always()
        shell: bash
        run: |
          test '${{ steps.playwright.outcome }}' = success
          test '${{ steps.validate.outcome }}' = success
