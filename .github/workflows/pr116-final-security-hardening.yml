name: PR116 Final Security Hardening

on:
  push:
    branches: [fix/final-production-professional-closeout]
    paths:
      - scripts/pr116-final-security-hardening.mjs
      - .github/workflows/pr116-final-security-hardening.yml

permissions:
  contents: write

concurrency:
  group: pr116-final-security-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-production-professional-closeout
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply deterministic final security hardening
        run: node scripts/pr116-final-security-hardening.mjs
      - name: Validate P0 boundary
        run: |
          npm run typecheck
          npm run verify:admin-mutations
      - name: Commit hardening and remove one-shot tooling
        run: |
          rm -f scripts/pr116-final-security-hardening.mjs .github/workflows/pr116-final-security-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(security): complete PR116 admin OIDC mutation boundary"
          git push origin HEAD:fix/final-production-professional-closeout
