name: Fix home hero highlight

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-home-hero-highlight:
    if: github.event.head_commit.message == 'Run homepage hero text fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage hero highlight
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          workflow = Path('.github/workflows/fix-home-hero-highlight.yml')
          text = page.read_text(encoding='utf-8')

          old = '      heroHighlight: getSetting(["home_hero_highlight", "hero_highlight"], "صناع المحتوى"),'
          new = '      heroHighlight: "وكالة حمزة",'

          if old not in text and new not in text:
              raise SystemExit('Target heroHighlight line was not found')

          if old in text:
              text = text.replace(old, new, 1)
              page.write_text(text, encoding='utf-8')

          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/fix-home-hero-highlight.yml
          git commit -m "Fix homepage hero second title text" || exit 0
          git push
