name: HAMZA AGENCY PR1 Isolated Runtime

on:
  workflow_call:
    inputs:
      expected_sha: { required: true, type: string }

permissions:
  contents: read

jobs:
  pr1-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: pr1-runtime-${{ inputs.expected_sha }}
      cancel-in-progress: false
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      PR1_WORKDIR: /tmp/hamza-pr1-runtime
      PR1_ENV_FILE: /tmp/hamza-pr1-runtime.env
      PR1_BUILDER_FILE: /tmp/hamza-pr1-build-current-state.mjs
      PR1_APPLY_FILE: /tmp/hamza-pr1-current-state.apply.sql
      PR1_START_LOG: /tmp/hamza-pr1-supabase-start.log
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Assert exact isolated Head
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.expected_sha }}' =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = '${{ inputs.expected_sha }}'
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${HAMZA_PRODUCTION_READONLY_URL:-}"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned isolated database tools
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          npm install --prefix tools/pr101-local-e2e --no-audit --no-fund
          cli="$GITHUB_WORKSPACE/tools/pr101-local-e2e/node_modules/.bin/supabase"
          test "$($cli --version)" = "2.109.1"
          echo "SUPABASE_BIN=$cli" >> "$GITHUB_ENV"

      - name: Build dependency-safe authoritative snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PR1_WORKDIR"
          mkdir -p "$PR1_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$PR1_WORKDIR/supabase/config.toml"
          sed -i 's/^project_id = .*/project_id = "hamza-pr1-runtime"/' "$PR1_WORKDIR/supabase/config.toml"
          printf '%s\n' '-- PR1 runtime verification creates bounded fixtures after schema apply.' > "$PR1_WORKDIR/supabase/seed.sql"
          cat scripts/closeout/build-current-state-apply.part{00,01,02,03} | base64 -d | gzip -d > "$PR1_BUILDER_FILE"
          snapshot="$GITHUB_WORKSPACE/supabase/current-state-schema/current-state-schema.sql"
          test "$(wc -c < "$snapshot" | tr -d '[:space:]')" = "496138"
          printf '%s  %s\n' '3b1890376e3cca966b1dce0979dd2ed089f95237e1067febf4f58e8f1bf776f2' "$snapshot" | sha256sum -c -
          test "$(git hash-object "$snapshot")" = "65f45c04f7bd50e7751eb5f802f3ad0550c52bfc"
          node "$PR1_BUILDER_FILE" "$snapshot" "$PR1_APPLY_FILE"

      - name: Start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          cd "$PR1_WORKDIR"
          "$SUPABASE_BIN" start --exclude studio,imgproxy >"$PR1_START_LOG" 2>&1
          "$SUPABASE_BIN" status -o env >"$PR1_ENV_FILE"
          chmod 600 "$PR1_ENV_FILE"
          cd "$GITHUB_WORKSPACE"
          for required in API_URL ANON_KEY SERVICE_ROLE_KEY JWT_SECRET DB_URL; do
            grep -q "^${required}=" "$PR1_ENV_FILE"
          done
          while IFS='=' read -r key value; do
            value="${value%\"}"; value="${value#\"}"
            [ -n "$value" ] && echo "::add-mask::$value"
          done < "$PR1_ENV_FILE"

      - name: Apply snapshot and staged PR-A migration chain
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$PR1_ENV_FILE"
          set +a
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f "$PR1_APPLY_FILE"
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260803003000_pr105_macro_runtime_completion.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260803004000_pr105_macro_runtime_hardening.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260803005000_pr105_macro_runtime_fixture_contract.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260803006000_pr105_commerce_lifecycle_hardening.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260803007000_pr105_operational_depth_completion.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260803008000_pr105_workflow_runtime_evidence_hardening.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260804090000_pr1_production_hardening_closeout.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260808210000_pr4_smart_support_notifications.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260808211000_pr4_support_notification_integrations.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260808211500_pr4_permission_hardening.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260808212000_pr4_marketplace_notification_hardening.sql
          bash scripts/closeout/pr-a-staged-runtime.sh "$DB_URL"
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -c "select pg_notify('pgrst','reload schema');"
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f tests/pr1-runtime-contract.sql

      - name: Verify real Data API, RLS, grants, and read-only probe
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$PR1_ENV_FILE"
          set +a
          node scripts/closeout/pr1-runtime-verify.mjs

      - name: Verify all public health states and passive-provider truthfulness
        id: health_states
        if: always()
        run: node --test tests/pr1-health-status.test.mjs

      - name: Always remove isolated runtime
        id: cleanup
        if: always()
        shell: bash
        run: |
          set +e
          status=0
          if [ -d "$PR1_WORKDIR" ] && [ -n "${SUPABASE_BIN:-}" ]; then
            cd "$PR1_WORKDIR" && "$SUPABASE_BIN" stop --no-backup || status=1
            cd "$GITHUB_WORKSPACE" || status=1
          fi
          rm -rf "$PR1_WORKDIR" "$PR1_ENV_FILE" "$PR1_BUILDER_FILE" "$PR1_APPLY_FILE" "$PR1_START_LOG" supabase/.temp
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            status=1
          fi
          exit "$status"

      - name: Preserve isolated runtime conclusion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          runtime='${{ steps.runtime.outcome }}'
          health='${{ steps.health_states.outcome }}'
          cleanup='${{ steps.cleanup.outcome }}'
          printf 'runtime=%s health=%s cleanup=%s\n' "$runtime" "$health" "$cleanup"
          test "$runtime:$health:$cleanup" = 'success:success:success'
