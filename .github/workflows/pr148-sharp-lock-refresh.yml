name: PR148 one-shot sharp lock refresh

on:
  push:
    branches:
      - fix/backup-validation-oidc-closeout
    paths:
      - .github/workflows/pr148-sharp-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backup-validation-oidc-closeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh Sharp patch and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund sharp@0.35.4
      - name: Remove one-shot workflow and commit generated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr148-sharp-lock-refresh.yml
          git add package.json package-lock.json
          git commit -m "Patch Sharp runtime to 0.35.4"
          git push origin HEAD:fix/backup-validation-oidc-closeout
