name: Dependency Audit Diagnostic (temporary)

on:
  push:
    branches:
      - fix/dependencies-auth-hardening
    paths:
      - .github/workflows/dependency-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Runtime audit
        shell: bash
        run: |
          npm audit --omit=dev --json > runtime-audit.json || true
          node -e "const a=require('./runtime-audit.json'); console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities},null,2))"
      - name: Full audit
        shell: bash
        run: |
          npm audit --json > full-audit.json || true
          node -e "const a=require('./full-audit.json'); console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities},null,2))"
      - name: Locked versions
        run: npm ls next react react-dom sharp postcss nanoid @playwright/test --all
