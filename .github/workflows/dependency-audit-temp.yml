name: Dependency Hardening Apply (temporary)

on:
  push:
    branches:
      - fix/dependencies-auth-hardening
    paths:
      - .github/workflows/dependency-audit-temp.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply exact source hardening
        run: python3 scripts/temp-final-hardening.py
      - name: Regenerate lockfile from targeted overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact lockfile
        run: npm ci --ignore-scripts
      - name: Verify dependency tree
        run: npm ls next react react-dom sharp postcss nanoid @playwright/test brace-expansion js-yaml --all
      - name: Verify runtime audit is limited to documented Next 15 nested advisories
        shell: bash
        run: |
          npm audit --omit=dev --json > runtime-audit.json || true
          node - <<'NODE'
          const a = require('./runtime-audit.json');
          const keys = Object.keys(a.vulnerabilities || {}).sort();
          const expected = ['next','postcss','sharp'];
          if (JSON.stringify(keys) !== JSON.stringify(expected)) throw new Error(`unexpected runtime audit keys: ${keys}`);
          if ((a.metadata?.vulnerabilities?.critical || 0) !== 0 || (a.metadata?.vulnerabilities?.high || 0) !== 3) throw new Error('runtime audit severity count changed');
          const postcss = a.vulnerabilities.postcss;
          const sharp = a.vulnerabilities.sharp;
          if (postcss?.isDirect || sharp?.isDirect) throw new Error('nested advisories became direct');
          if (!postcss?.nodes?.every((n) => n === 'node_modules/next/node_modules/postcss')) throw new Error('unexpected postcss path');
          if (!sharp?.nodes?.every((n) => n === 'node_modules/next/node_modules/sharp')) throw new Error('unexpected sharp path');
          if (a.vulnerabilities.next?.fixAvailable?.version !== '16.3.3' || a.vulnerabilities.next?.fixAvailable?.isSemVerMajor !== true) throw new Error('Next remediation boundary changed');
          console.log('Runtime audit residual is exactly the documented Next 15 nested boundary.');
          NODE
      - name: Verify dev-only high findings are fixed
        shell: bash
        run: |
          npm audit --json > full-audit.json || true
          node - <<'NODE'
          const a = require('./full-audit.json');
          const keys = Object.keys(a.vulnerabilities || {}).sort();
          const expected = ['next','postcss','sharp'];
          if (JSON.stringify(keys) !== JSON.stringify(expected)) throw new Error(`unexpected full audit keys: ${keys}`);
          if ((a.metadata?.vulnerabilities?.critical || 0) !== 0 || (a.metadata?.vulnerabilities?.high || 0) !== 3) throw new Error('full audit severity count changed');
          console.log('brace-expansion and js-yaml high findings are closed; only documented Next 15 nested findings remain.');
          NODE
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Focused auth tests
        run: node --test tests/auth-hardening.test.mjs tests/admin-mutation-boundary.test.mjs
      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json app/api/admin/mutations/workflows/route.ts app/api/admin/translations/sync/route.ts tests/auth-hardening.test.mjs
          git diff --cached --check
          git commit -m "security: close remaining auth and compatible transitive gaps"
          git push
