name: PR116 Final Ledger Docs Sync
on:
  push:
    branches: [fix/final-production-professional-closeout]
    paths:
      - scripts/pr116-final-ledger-docs-sync.mjs
      - .github/workflows/pr116-final-ledger-docs-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-production-professional-closeout
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize final ledger and handoff
        run: node scripts/pr116-final-ledger-docs-sync.mjs
      - name: Commit final documentation freeze
        run: |
          rm -f scripts/pr116-final-ledger-docs-sync.mjs .github/workflows/pr116-final-ledger-docs-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "docs(closeout): synchronize final owner QA handoff"
          git push origin HEAD:fix/final-production-professional-closeout
