name: HAMZA AGENCY Full Project Closeout

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/hamza-closeout-*.yml"
      - ".github/workflows/hamza-agency-full-project-closeout.yml"
      - ".github/workflows/hamza-macro-runtime-suite.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "e2e/closeout/**"
      - "scripts/closeout/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "tests/closeout-automation.test.mjs"
      - "tests/pr1-*.test.mjs"
      - "tests/pr1-runtime-contract.sql"
      - "playwright.closeout.config.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  actions: read
  deployments: read
  statuses: read
  issues: read
  pull-requests: read

concurrency:
  group: hamza-closeout-structure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.diff.outputs.run_full }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Fail-closed documentation-only change check
        id: diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          let runFull = true;
          let priorRun = null;
          try {
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const before = event.before;
            const after = event.after;
            const valid = (s) => typeof s === 'string' && /^[a-f0-9]{40}$/.test(s);
            if (event.action === 'synchronize' && valid(before) && valid(after) &&
                after === process.env.EXPECTED_SHA && before !== after) {
              try { execFileSync('git', ['cat-file', '-e', before + '^{commit}'], {stdio: 'ignore'}); }
              catch { execFileSync('git', ['fetch', '--no-tags', '--depth=1', 'origin', before], {stdio: 'ignore'}); }
              const files = execFileSync('git', ['diff', '--name-only', '-z', before, after]).toString('utf8').split('\0').filter(Boolean);
              const docsOnly = files.length > 0 && files.every((p) =>
                p.startsWith('docs/') || /^(README|CHANGELOG)\.mdx?$/i.test(p));
              if (docsOnly) {
                const endpoint = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY +
                  '/actions/workflows/hamza-closeout-structure.yml/runs?event=pull_request&head_sha=' + before + '&per_page=10';
                const response = await fetch(endpoint, {headers: {
                  Authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                  Accept: 'application/vnd.github+json'
                }});
                if (response.ok) {
                  const data = await response.json();
                  const prior = (data.workflow_runs || []).find((r) =>
                    r.head_sha === before && r.status === 'completed' && r.conclusion === 'success');
                  if (prior) { runFull = false; priorRun = prior.html_url; }
                }
              }
            }
          } catch { runFull = true; }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run_full=' + String(runFull) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            runFull ? 'Full validation required for this PR update.\n' :
              'Documentation-only update; prior successful closeout: ' + priorRun + '. No suite was rerun.\n');
          NODE
  validate:
    needs: scope
    if: >-
      needs.scope.outputs.run_full == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Assert exact trusted event Head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test '${{ github.event.pull_request.base.ref }}' = main
          test '${{ github.event.pull_request.head.repo.full_name }}' = '${{ github.repository }}'
          test '${{ github.actor }}' != 'dependabot[bot]'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate closeout structure contracts
        shell: bash
        run: |
          set -euo pipefail
          for suite in public translations tracking admin page-builder backup-restore trash notifications permissions security commerce tasks sla workflows; do
            test -f "e2e/closeout/$suite.spec.mjs"
          done
          ! grep -R "test.skip" e2e/closeout
          ! grep -R 'pr99-fixture\|/pr99-e2e' e2e/closeout/{tracking,page-builder,backup-restore,trash,notifications,admin}.spec.mjs
          grep -q "core-runtime-fixtures.mjs setup" .github/workflows/hamza-macro-runtime-suite.yml
          grep -q "20260803006000_pr105_commerce_lifecycle_hardening.sql" .github/workflows/hamza-macro-runtime-suite.yml
          test -f .github/workflows/hamza-closeout-pr1-runtime.yml
          test -f scripts/closeout/discover-vercel-preview.mjs
          test -f scripts/closeout/pr1-runtime-verify.mjs
          node - <<'NODE'
          const fs=require('fs'); const suites=require('./e2e/closeout/suites.json');
          for(const name of ['public','translations','tracking','admin','page-builder','backup-restore','trash','notifications','permissions','security','commerce','tasks','sla','workflows']){
            if(suites[name]?.status!=='implemented') throw new Error(`${name}:not-implemented`);
            if(!fs.existsSync(`e2e/closeout/${suites[name].spec}`)) throw new Error(`${name}:missing-spec`);
          }
          NODE
      - name: Run closeout contract tests
        run: node --test tests/closeout-automation.test.mjs tests/pr1-production-hardening.test.mjs tests/pr1-health-status.test.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck trusted Admin RPC dispatch
        run: npx --no-install tsc --strict --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler supabase/functions/pr116-admin-oidc-gateway/trusted-rpc-dispatch.ts
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build

  exact-preview:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      preview_url: ${{ steps.preview.outputs.preview_url }}
      preview_host: ${{ steps.preview.outputs.preview_host }}
      preview_source: ${{ steps.preview.outputs.preview_source }}
      preview_inspector: ${{ steps.preview.outputs.preview_inspector }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - id: preview
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}"
          bypass_secret="$VERCEL_AUTOMATION_BYPASS_SECRET"
          echo "::add-mask::$bypass_secret"
          node scripts/closeout/discover-vercel-preview.mjs
          preview_url="$(grep '^preview_url=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          test -n "$preview_url"
          health_status="$(curl -fsS -H "x-vercel-protection-bypass: $bypass_secret" "$preview_url/api/health" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{try{const p=JSON.parse(x);if(p.status==="ok")process.stdout.write("ok")}catch{}})')"
          test "$health_status" = ok

  preview-public-evidence:
    needs: [scope, exact-preview]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: preview-readonly
      suite: public
      target_url: "${{ needs.exact-preview.outputs.preview_url }}"
      preview_host: "${{ needs.exact-preview.outputs.preview_host }}"
      expected_sha: "${{ github.event.pull_request.head.sha }}"
    secrets:
      vercel_automation_bypass_secret: "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"

  preview-translations-evidence:
    needs: [scope, exact-preview]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: preview-readonly
      suite: translations
      target_url: "${{ needs.exact-preview.outputs.preview_url }}"
      preview_host: "${{ needs.exact-preview.outputs.preview_host }}"
      expected_sha: "${{ github.event.pull_request.head.sha }}"
    secrets:
      vercel_automation_bypass_secret: "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"

  preview-security-evidence:
    needs: [scope, exact-preview]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: preview-readonly
      suite: security
      target_url: "${{ needs.exact-preview.outputs.preview_url }}"
      preview_host: "${{ needs.exact-preview.outputs.preview_host }}"
      expected_sha: "${{ github.event.pull_request.head.sha }}"
    secrets:
      vercel_automation_bypass_secret: "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"

  public-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with: { execution_mode: local-isolated, suite: public, target_url: "https://127.0.0.1:3443", expected_sha: "${{ github.event.pull_request.head.sha }}" }
  translations-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with: { execution_mode: local-isolated, suite: translations, target_url: "https://127.0.0.1:3443", expected_sha: "${{ github.event.pull_request.head.sha }}" }
  permissions-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with: { execution_mode: local-isolated, suite: permissions, target_url: "https://127.0.0.1:3443", expected_sha: "${{ github.event.pull_request.head.sha }}" }
  security-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with: { execution_mode: local-isolated, suite: security, target_url: "https://127.0.0.1:3443", expected_sha: "${{ github.event.pull_request.head.sha }}" }

  tracking-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-macro-runtime-suite.yml
    with: { suite: tracking, expected_sha: "${{ github.event.pull_request.head.sha }}" }
  admin-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-macro-runtime-suite.yml
    with: { suite: admin, expected_sha: "${{ github.event.pull_request.head.sha }}" }
  page-builder-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-macro-runtime-suite.yml
    with: { suite: page-builder, expected_sha: "${{ github.event.pull_request.head.sha }}" }
  backup-restore-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-macro-runtime-suite.yml
    with: { suite: backup-restore, expected_sha: "${{ github.event.pull_request.head.sha }}" }
  trash-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-macro-runtime-suite.yml
    with: { suite: trash, expected_sha: "${{ github.event.pull_request.head.sha }}" }
  notifications-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-macro-runtime-suite.yml
    with: { suite: notifications, expected_sha: "${{ github.event.pull_request.head.sha }}" }
  commerce-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-macro-runtime-suite.yml
    with: { suite: commerce, expected_sha: "${{ github.event.pull_request.head.sha }}" }
  tasks-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-macro-runtime-suite.yml
    with: { suite: tasks, expected_sha: "${{ github.event.pull_request.head.sha }}" }
  sla-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-macro-runtime-suite.yml
    with: { suite: sla, expected_sha: "${{ github.event.pull_request.head.sha }}" }
  workflows-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-macro-runtime-suite.yml
    with: { suite: workflows, expected_sha: "${{ github.event.pull_request.head.sha }}" }

  pr1-runtime-evidence:
    needs: [scope, validate]
    if: needs.scope.outputs.run_full == 'true'
    uses: ./.github/workflows/hamza-closeout-pr1-runtime.yml
    with:
      expected_sha: "${{ github.event.pull_request.head.sha }}"

  aggregate:
    if: >-
      always() &&
      needs.scope.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    needs:
      - scope
      - validate
      - exact-preview
      - preview-public-evidence
      - preview-translations-evidence
      - preview-security-evidence
      - public-evidence
      - translations-evidence
      - permissions-evidence
      - security-evidence
      - tracking-evidence
      - admin-evidence
      - page-builder-evidence
      - backup-restore-evidence
      - trash-evidence
      - notifications-evidence
      - commerce-evidence
      - tasks-evidence
      - sla-evidence
      - workflows-evidence
      - pr1-runtime-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on any missing, skipped, or unsuccessful suite
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          node - <<'NODE'
          const needs=JSON.parse(process.env.NEEDS_JSON);
          const { scope, ...suites } = needs;
          if (scope.result !== 'success') throw new Error('Scope verification failed');
          if (scope.outputs.run_full === 'false') {
            const unexpected=Object.entries(suites).filter(([,v])=>v.result!=='skipped');
            if(unexpected.length) throw new Error('Unexpected suite results for docs-only update');
            console.log('DOCS_ONLY: prior successful Head verified; suites not rerun.');
          } else {
            const failed=Object.entries(suites).filter(([,value])=>value.result!=='success');
            if(failed.length) throw new Error(`Closeout failed: ${failed.map(([name,value])=>`${name}:${value.result}`).join(', ')}`);
          }
          NODE
