name: PR154 Dependency Lockfile Refresh
on:
  push:
    branches:
      - fix/csp-remove-unsafe-eval-20261008
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-lockfile:
    if: github.repository == 'hamzaagency1357/hamza-agency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate lockfile with npm registry resolution
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit only regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore: regenerate PR154 dependency lockfile"
          git push origin HEAD:fix/csp-remove-unsafe-eval-20261008
