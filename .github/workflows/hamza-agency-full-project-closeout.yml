name: HAMZA AGENCY Full Project Closeout

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Final pinned 40-character Head SHA
        required: true
        type: string
      preview_url:
        description: Exact Vercel Preview URL for the same Head
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    outputs:
      preview_host: ${{ steps.url.outputs.preview_host }}
    steps:
      - id: url
        shell: bash
        run: |
          set -euo pipefail
          url='${{ inputs.preview_url }}'
          [[ "$url" == https://* ]]
          [[ "$url" != https://hamza-agency.com* && "$url" != https://www.hamza-agency.com* ]]
          host="$(node -e 'process.stdout.write(new URL(process.argv[1]).hostname)' "$url")"
          test -n "$host"
          echo "preview_host=$host" >> "$GITHUB_OUTPUT"

  exact-head-and-existing-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
      - name: Assert exact final Head
        run: |
          [[ '${{ inputs.expected_sha }}' =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = '${{ inputs.expected_sha }}'
      - name: Require every registered suite to be complete
        run: |
          pending="$(node -e 'const s=require("./e2e/closeout/suites.json"); console.log(Object.entries(s).filter(([,v])=>v.status!=="implemented"||v.stateful_extension==="pending").map(([k])=>k).join(","))')"
          if [ -n "$pending" ]; then echo "Full closeout blocked by pending suites: $pending" >&2; exit 1; fi
      - name: Verify required existing workflow conclusions for this Head
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ inputs.expected_sha }}';
            const required = new Set([
              'HAMZA AGENCY Quality Gate',
              'PR99 Management Quality Gate',
              'PR101 Checkpoint 1B Local E2E',
              'PR101 Mobile Readiness',
              'HAMZA AGENCY Closeout Structure'
            ]);
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: sha, per_page: 100
            });
            const successful = new Set(data.workflow_runs.filter(r => r.status === 'completed' && r.conclusion === 'success').map(r => r.name));
            const missing = [...required].filter(name => !successful.has(name));
            if (missing.length) core.setFailed(`Missing successful exact-head gates: ${missing.join(', ')}`);

  preview-public:
    needs: validate-preview
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: preview-readonly
      suite: public
      target_url: ${{ inputs.preview_url }}
      expected_sha: ${{ inputs.expected_sha }}
      preview_host: ${{ needs.validate-preview.outputs.preview_host }}

  preview-translations:
    needs: validate-preview
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: preview-readonly
      suite: translations
      target_url: ${{ inputs.preview_url }}
      expected_sha: ${{ inputs.expected_sha }}
      preview_host: ${{ needs.validate-preview.outputs.preview_host }}

  preview-security:
    needs: validate-preview
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: preview-readonly
      suite: security
      target_url: ${{ inputs.preview_url }}
      expected_sha: ${{ inputs.expected_sha }}
      preview_host: ${{ needs.validate-preview.outputs.preview_host }}

  local-tracking:
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: local-isolated
      suite: tracking
      target_url: https://127.0.0.1:3443
      expected_sha: ${{ inputs.expected_sha }}

  local-admin:
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: local-isolated
      suite: admin
      target_url: https://127.0.0.1:3443
      expected_sha: ${{ inputs.expected_sha }}

  local-page-builder:
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: local-isolated
      suite: page-builder
      target_url: https://127.0.0.1:3443
      expected_sha: ${{ inputs.expected_sha }}

  local-backup-restore:
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: local-isolated
      suite: backup-restore
      target_url: https://127.0.0.1:3443
      expected_sha: ${{ inputs.expected_sha }}

  local-trash:
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: local-isolated
      suite: trash
      target_url: https://127.0.0.1:3443
      expected_sha: ${{ inputs.expected_sha }}

  local-notifications:
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: local-isolated
      suite: notifications
      target_url: https://127.0.0.1:3443
      expected_sha: ${{ inputs.expected_sha }}

  local-permissions:
    uses: ./.github/workflows/hamza-closeout-suite.yml
    with:
      execution_mode: local-isolated
      suite: permissions
      target_url: https://127.0.0.1:3443
      expected_sha: ${{ inputs.expected_sha }}

  closeout-summary:
    needs: [validate-preview, exact-head-and-existing-gates, preview-public, preview-translations, preview-security, local-tracking, local-admin, local-page-builder, local-backup-restore, local-trash, local-notifications, local-permissions]
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # HAMZA AGENCY Full Project Closeout
          - Head: \`${{ inputs.expected_sha }}\`
          - Existing Quality Gates: reused and verified on the same Head
          - Preview host: \`${{ needs.validate-preview.outputs.preview_host }}\`
          - Preview suites: public, translations, security
          - Local isolated suites: tracking, admin, page-builder, backup-restore, trash, notifications, permissions
          - Production writes: none
          - Result: all implemented closeout gates passed
          EOF
