name: PR101 Checkpoint 1B Local E2E

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pr101-checkpoint-1b-local-e2e.yml"
      - "app/api/product-expansion/invitations/**"
      - "app/api/product-expansion/sessions/**"
      - "app/api/product-expansion/tenant-access/**"
      - "lib/server/tenantAuthorization.ts"
      - "lib/server/tenantRuntime.ts"
      - "lib/server/supabaseUser.ts"
      - "supabase/checkpoint-1b-contract/**"
      - "supabase/migrations/2026073102*.sql"
      - "supabase/migrations/2026073103*.sql"
      - "scripts/pr101-local-*.mjs"
      - "tools/pr101-local-e2e/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr101-checkpoint-1b-local-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_TELEMETRY_DISABLED: "1"
  PR101_FIXTURE_FILE: /tmp/pr101-local-fixtures.json
  PR101_APP_URL: http://127.0.0.1:3000
  PR101_WORKDIR: .tmp/pr101-checkpoint-1b

jobs:
  local-e2e:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/pr101-complete-product-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact PR head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "Checkpoint 1B head: $actual"
          test "$actual" = "$expected"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify Docker and install PostgreSQL client
        run: |
          docker info >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Supabase CLI
        run: |
          npm install --prefix tools/pr101-local-e2e --no-audit --no-fund
          cli="$GITHUB_WORKSPACE/tools/pr101-local-e2e/node_modules/.bin/supabase"
          test -x "$cli"
          ln -sf "$cli" "$GITHUB_WORKSPACE/node_modules/.bin/supabase"
          echo "SUPABASE_BIN=$cli" >> "$GITHUB_ENV"

      - name: Verify pinned Supabase CLI commands
        run: |
          test "$(npx --no-install supabase --version)" = "2.109.1"
          npx --no-install supabase start --help >/tmp/pr101-start-help.txt
          npx --no-install supabase db reset --help >/dev/null
          npx --no-install supabase stop --help >/dev/null
          test -f supabase/config.toml
          test -f supabase/checkpoint-1b-contract/baseline.sql
          test -f supabase/checkpoint-1b-contract/register-platform-session.sql

      - name: Assert Production isolation
        run: |
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          prod_ref="fvaurkfn""svsfohpzguho"
          ! grep -R "$prod_ref" scripts/pr101-local-*.mjs supabase/checkpoint-1b-contract
          ! grep -RIE "supabase[[:space:]]+link|db[[:space:]]+push" .github/workflows/pr101-checkpoint-1b-local-e2e.yml scripts/pr101-local-*.mjs

      - name: Build bounded temporary Supabase project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PR101_WORKDIR"
          mkdir -p "$PR101_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$PR101_WORKDIR/supabase/config.toml"
          printf '%s\n' '-- Synthetic fixtures are created through the local Auth Admin API after reset.' > "$PR101_WORKDIR/supabase/seed.sql"
          cp supabase/checkpoint-1b-contract/baseline.sql "$PR101_WORKDIR/supabase/migrations/20260731020000_checkpoint_1b_contract.sql"
          cp supabase/checkpoint-1b-contract/register-platform-session.sql "$PR101_WORKDIR/supabase/migrations/20260731021000_checkpoint_1b_platform_session_contract.sql"
          for migration in \
            20260731024500_pr101_operational_tenant_invitations_hardened.sql \
            20260731031000_pr101_invitation_crypto_search_path.sql \
            20260731031100_pr101_invitation_create_qualified_columns.sql \
            20260731031125_pr101_membership_unique_constraint.sql \
            20260731031150_pr101_invitation_rpc_qualified_columns.sql \
            20260731031175_pr101_invitation_accept_named_conflict.sql \
            20260731031200_pr101_public_tenant_runtime_exact_host.sql \
            20260731031300_pr101_notification_trigger_record_guard.sql \
            20260731031400_pr101_membership_auth_session_revocation.sql \
            20260731031500_pr101_membership_rpc_only_writes.sql; do
            cp "supabase/migrations/$migration" "$PR101_WORKDIR/supabase/migrations/$migration"
          done
          test "$(find "$PR101_WORKDIR/supabase/migrations" -type f -name '*.sql' | wc -l)" -eq 12

      - name: Start isolated local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$PR101_WORKDIR"
          start_args=()
          if grep -q -- '--exclude' /tmp/pr101-start-help.txt; then
            start_args+=(--exclude studio,imgproxy)
          fi
          if ! "$SUPABASE_BIN" start "${start_args[@]}" >/tmp/pr101-supabase-start.log 2>&1; then
            sed -E 's/(sb_(publishable|secret)_[A-Za-z0-9_-]+)/[REDACTED]/g; s#postgresql?://[^[:space:]]+#[REDACTED_DB_URL]#g' /tmp/pr101-supabase-start.log >&2
            exit 1
          fi
          echo "Supabase Local started with nonessential services excluded."

      - name: Reset contract schema and pending migrations
        run: |
          cd "$PR101_WORKDIR"
          "$SUPABASE_BIN" db reset

      - name: Capture and mask local-only runtime values
        shell: bash
        run: |
          set +x
          cd "$PR101_WORKDIR"
          "$SUPABASE_BIN" status -o env > /tmp/pr101-supabase.env
          for required in API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL; do
            grep -q "^${required}=" /tmp/pr101-supabase.env || { echo "missing local ${required}" >&2; exit 1; }
          done
          while IFS='=' read -r key value; do
            value="${value%\"}"
            value="${value#\"}"
            [ -n "$value" ] && echo "::add-mask::$value"
            case "$key" in
              API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL) echo "$key=$value" >> "$GITHUB_ENV" ;;
            esac
          done < /tmp/pr101-supabase.env

      - name: Create synthetic local Auth and tenant fixtures
        run: node scripts/pr101-local-fixtures.mjs

      - name: Start Next.js against Supabase Local only
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://tenant-a.test
          SESSION_HASH_KEY: pr101-local-runner-only-session-hash-key
        run: |
          set +x
          nohup npm run dev -- --hostname 127.0.0.1 --port 3000 >/tmp/pr101-next.log 2>&1 &
          echo $! >/tmp/pr101-next.pid
          for attempt in $(seq 1 90); do
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 2
          done
          echo "Next.js did not become ready" >&2
          tail -n 120 /tmp/pr101-next.log >&2
          exit 1

      - name: Run authenticated invitation, suspension and concurrency E2E
        run: node scripts/pr101-local-e2e.mjs

      - name: Verify tenant-scoped revoked platform session behavior
        run: node scripts/pr101-local-platform-session-check.mjs

      - name: Confirm local stack remains healthy
        run: |
          cd "$PR101_WORKDIR"
          "$SUPABASE_BIN" status >/dev/null
          test -s "$PR101_FIXTURE_FILE"

      - name: Diagnostic logs without credentials
        if: failure()
        run: |
          if [ -f /tmp/pr101-next.log ]; then tail -n 160 /tmp/pr101-next.log | sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g'; fi
          cd "$PR101_WORKDIR" 2>/dev/null && "$SUPABASE_BIN" status >/dev/null || true

      - name: Always destroy local stack and temporary credentials
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/pr101-next.pid ]; then kill "$(cat /tmp/pr101-next.pid)" 2>/dev/null || true; fi
          pkill -f "next dev" 2>/dev/null || true
          rm -f /tmp/pr101-next.pid /tmp/pr101-next.log "$PR101_FIXTURE_FILE" /tmp/pr101-supabase.env /tmp/pr101-start-help.txt /tmp/pr101-supabase-start.log
          if [ -d "$PR101_WORKDIR" ]; then
            cd "$PR101_WORKDIR"
            "$SUPABASE_BIN" stop --no-backup >/dev/null 2>&1
            cd "$GITHUB_WORKSPACE"
          fi
          rm -rf "$PR101_WORKDIR"
