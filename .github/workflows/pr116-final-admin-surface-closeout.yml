name: PR116 Final Admin Surface Closeout
on:
  push:
    branches: [fix/final-production-professional-closeout]
    paths:
      - scripts/pr116-final-admin-surface-closeout.mjs
      - .github/workflows/pr116-final-admin-surface-closeout.yml
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-production-professional-closeout
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply focused closeout patch
        run: node scripts/pr116-final-admin-surface-closeout.mjs
      - name: Focused validation
        run: |
          npm run lint
          npm run typecheck
          node --test tests/admin-mutation-boundary.test.mjs
      - name: Commit validated closeout changes
        run: |
          rm -f scripts/pr116-final-admin-surface-closeout.mjs .github/workflows/pr116-final-admin-surface-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): close full browser admin mutation surface"
          git push origin HEAD:fix/final-production-professional-closeout
