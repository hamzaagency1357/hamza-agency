name: HAMZA AGENCY Closeout Lock Sync

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/hamza-closeout-lock-sync.yml"

permissions:
  contents: write

concurrency:
  group: hamza-closeout-lock-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    if: >-
      github.head_ref == 'feat/pr101-complete-product-expansion' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate deterministic package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit only package-lock.json when required
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M package-lock.json$' || true)"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(closeout): lock Playwright 1.55.0"
          git push origin "HEAD:${{ github.head_ref }}"
