name: HAMZA AGENCY Closeout Suite

on:
  workflow_call:
    inputs:
      execution_mode: { required: true, type: string }
      suite: { required: true, type: string }
      target_url: { required: true, type: string }
      expected_sha: { required: true, type: string }
      preview_host: { required: false, type: string, default: "" }

permissions:
  contents: read

jobs:
  closeout-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: closeout-${{ inputs.execution_mode }}-${{ inputs.suite }}-${{ inputs.expected_sha }}
      cancel-in-progress: false
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      CLOSEOUT_EXECUTION_MODE: ${{ inputs.execution_mode }}
      CLOSEOUT_SUITE: ${{ inputs.suite }}
      CLOSEOUT_TARGET_URL: ${{ inputs.target_url }}
      CLOSEOUT_PREVIEW_HOST: ${{ inputs.preview_host }}
      CLOSEOUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
      CLOSEOUT_ACTUAL_SHA: ${{ inputs.expected_sha }}
      CLOSEOUT_SUPABASE_URL: ${{ inputs.execution_mode == 'local-isolated' && 'http://127.0.0.1:54321' || '' }}
      CLOSEOUT_AUTH_URL: ${{ inputs.execution_mode == 'local-isolated' && 'http://127.0.0.1:54321/auth/v1' || '' }}
      CLOSEOUT_PORTAL_FIXTURE_FILE: /tmp/hamza-portal-fixtures.json
      CLOSEOUT_PORTAL_WORKDIR: .tmp/portal-closeout
      NEXT_PUBLIC_SITE_URL: https://127.0.0.1:3443
      SESSION_HASH_KEY: closeout-local-only-session-hash-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
      - name: Assert exact Head
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.expected_sha }}' =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Reject unsupported, pending, or unsafe dispatch
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.suite }}" in admin|permissions|security) stateful=true ;; *) stateful=false ;; esac
          echo "CLOSEOUT_STATEFUL=$stateful" >> "$GITHUB_ENV"
          CLOSEOUT_STATEFUL="$stateful" node scripts/closeout/environment-guard.mjs
          status="$(node -e 'const s=require("./e2e/closeout/suites.json"); const x=s[process.env.CLOSEOUT_SUITE]; if(!x) process.exit(2); process.stdout.write(x.status)')"
          test "$status" = "implemented" || { echo "Suite '${{ inputs.suite }}' is registered but not implemented; failing closed." >&2; exit 1; }
          test -f "e2e/closeout/${{ inputs.suite }}.spec.mjs"
      - name: Install isolated database tooling
        if: inputs.execution_mode == 'local-isolated' && (inputs.suite == 'admin' || inputs.suite == 'permissions' || inputs.suite == 'security')
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          npm install --prefix tools/pr101-local-e2e --no-audit --no-fund
          cli="$GITHUB_WORKSPACE/tools/pr101-local-e2e/node_modules/.bin/supabase"
          test -x "$cli"
          test "$($cli --version)" = "2.109.1"
          echo "SUPABASE_BIN=$cli" >> "$GITHUB_ENV"
      - name: Build bounded temporary portal project
        if: inputs.execution_mode == 'local-isolated' && (inputs.suite == 'admin' || inputs.suite == 'permissions' || inputs.suite == 'security')
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CLOSEOUT_PORTAL_WORKDIR"
          mkdir -p "$CLOSEOUT_PORTAL_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$CLOSEOUT_PORTAL_WORKDIR/supabase/config.toml"
          printf '%s\n' '-- Synthetic portal fixtures are created after reset.' > "$CLOSEOUT_PORTAL_WORKDIR/supabase/seed.sql"
          cp supabase/portal-closeout-contract/baseline.sql "$CLOSEOUT_PORTAL_WORKDIR/supabase/migrations/20260731010000_portal_closeout_contract.sql"
          test "$(find "$CLOSEOUT_PORTAL_WORKDIR/supabase/migrations" -type f -name '*.sql' | wc -l)" -eq 1
      - name: Start isolated Supabase and create portal fixtures
        if: inputs.execution_mode == 'local-isolated' && (inputs.suite == 'admin' || inputs.suite == 'permissions' || inputs.suite == 'security')
        shell: bash
        run: |
          set -euo pipefail
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          cd "$CLOSEOUT_PORTAL_WORKDIR"
          if ! "$SUPABASE_BIN" start --exclude studio,imgproxy >/tmp/closeout-supabase-start.log 2>&1; then
            sed -E 's/(sb_(publishable|secret)_[A-Za-z0-9_-]+)/[REDACTED]/g; s#postgresql?://[^[:space:]]+#[REDACTED_DB_URL]#g' /tmp/closeout-supabase-start.log >&2
            exit 1
          fi
          "$SUPABASE_BIN" db reset
          "$SUPABASE_BIN" status -o env >/tmp/closeout-supabase.env
          chmod 600 /tmp/closeout-supabase.env
          cd "$GITHUB_WORKSPACE"
          for required in API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL; do grep -q "^${required}=" /tmp/closeout-supabase.env; done
          while IFS='=' read -r key value; do
            value="${value%\"}"; value="${value#\"}"
            [ -n "$value" ] && echo "::add-mask::$value"
            case "$key" in
              API_URL) echo "API_URL=$value" >> "$GITHUB_ENV"; echo "NEXT_PUBLIC_SUPABASE_URL=$value" >> "$GITHUB_ENV" ;;
              ANON_KEY) echo "ANON_KEY=$value" >> "$GITHUB_ENV"; echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$value" >> "$GITHUB_ENV" ;;
              DB_URL) echo "DB_URL=$value" >> "$GITHUB_ENV" ;;
              SERVICE_ROLE_KEY) : ;;
            esac
          done < /tmp/closeout-supabase.env
          set -a; . /tmp/closeout-supabase.env; set +a
          node scripts/closeout/portal-local-fixtures.mjs setup
      - name: Build isolated local application
        if: inputs.execution_mode == 'local-isolated'
        run: npm run build
      - name: Start isolated local HTTPS target
        if: inputs.execution_mode == 'local-isolated'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hamza-closeout-tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/hamza-closeout-tls/key.pem -out /tmp/hamza-closeout-tls/cert.pem -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost'
          npm run start >/tmp/hamza-closeout-next.log 2>&1 & echo $! >/tmp/hamza-closeout-next.pid
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 2; done
          CLOSEOUT_TLS_KEY=/tmp/hamza-closeout-tls/key.pem CLOSEOUT_TLS_CERT=/tmp/hamza-closeout-tls/cert.pem CLOSEOUT_UPSTREAM_URL=http://127.0.0.1:3000 CLOSEOUT_HTTPS_PORT=3443 node scripts/closeout/local-https-proxy.mjs >/tmp/hamza-closeout-proxy.log 2>&1 &
          echo $! >/tmp/hamza-closeout-proxy.pid
          for i in {1..40}; do curl -kfsS https://127.0.0.1:3443/ >/dev/null && exit 0; sleep 2; done
          cat /tmp/hamza-closeout-next.log /tmp/hamza-closeout-proxy.log
          exit 1
      - name: Install pinned Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run selected Playwright suite
        run: npx --no-install playwright test --config=playwright.closeout.config.mjs
      - name: Validate executed suite results
        run: node scripts/closeout/validate-results.mjs artifacts/raw/results.json "${{ inputs.suite }}"
      - name: Sanitize reports into isolated safe directory
        run: node scripts/closeout/sanitize-artifacts.mjs artifacts/raw artifacts/safe/reports
      - name: Scan sanitized artifacts for secrets
        run: node scripts/closeout/scan-safe-artifacts.mjs artifacts/safe
      - name: Upload safe reports only
        uses: actions/upload-artifact@v4
        with:
          name: closeout-${{ inputs.execution_mode }}-${{ inputs.suite }}-${{ inputs.expected_sha }}
          path: artifacts/safe
          if-no-files-found: error
          retention-days: 14
      - name: Always remove fixtures and local runtime
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$CLOSEOUT_PORTAL_FIXTURE_FILE" ] && [ -f /tmp/closeout-supabase.env ]; then
            set -a; . /tmp/closeout-supabase.env; set +a
            node scripts/closeout/portal-local-fixtures.mjs cleanup
          fi
          if [ -f /tmp/hamza-closeout-next.pid ]; then kill "$(cat /tmp/hamza-closeout-next.pid)" 2>/dev/null; fi
          if [ -f /tmp/hamza-closeout-proxy.pid ]; then kill "$(cat /tmp/hamza-closeout-proxy.pid)" 2>/dev/null; fi
          if [ -d "$CLOSEOUT_PORTAL_WORKDIR" ] && [ -n "${SUPABASE_BIN:-}" ]; then cd "$CLOSEOUT_PORTAL_WORKDIR" && "$SUPABASE_BIN" stop --no-backup >/dev/null 2>&1; cd "$GITHUB_WORKSPACE"; fi
          rm -rf artifacts/raw /tmp/hamza-closeout-* /tmp/closeout-supabase* "$CLOSEOUT_PORTAL_FIXTURE_FILE" "$CLOSEOUT_PORTAL_WORKDIR" supabase/.temp
          test ! -e artifacts/raw
          test ! -e "$CLOSEOUT_PORTAL_FIXTURE_FILE"
          test ! -e "$CLOSEOUT_PORTAL_WORKDIR"
