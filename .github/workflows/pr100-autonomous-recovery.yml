name: PR100 Autonomous Recovery

on:
  push:
    branches:
      - fix/localized-home-program-summaries

permissions:
  contents: write

concurrency:
  group: pr100-autonomous-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/localized-home-program-summaries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply recovery patch
        run: node scripts/pr100-autonomous-recovery.mjs
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify checkpoint
        run: |
          npm run typecheck
          npm run lint
          npm run verify:translations
          npm run verify:migrations
          npm run verify:secrets
          npm test
          npm run build
      - name: Commit checkpoint
        run: |
          rm -f scripts/pr100-autonomous-recovery.mjs .github/workflows/pr100-autonomous-recovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --stat
          git commit -m "feat(pr100): complete secure tracking and admin recovery"
          git push origin HEAD:fix/localized-home-program-summaries
