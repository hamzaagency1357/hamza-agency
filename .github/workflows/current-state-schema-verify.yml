name: HAMZA Current-State Schema Verify

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/current-state-schema/**"
      - "scripts/closeout/export-current-state-schema.sh"
      - "scripts/closeout/export-current-state-schema.sql"
      - "scripts/closeout/verify-current-state-schema.mjs"
      - "scripts/closeout/run-current-state-schema-owner.sh"
      - "scripts/closeout/finalize-current-state-schema.sh"
      - "scripts/closeout/materialize-current-state-schema.mjs"
      - ".github/workflows/current-state-schema-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-state-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_TELEMETRY_DISABLED: "1"
  SCHEMA_WORKDIR: /tmp/hamza-current-state-schema-verify

jobs:
  verify-sanitized-snapshot:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/pr101-complete-product-expansion'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact PR head and Production isolation
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "${HAMZA_PRODUCTION_READONLY_URL:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test ! -d supabase/current-state-schema/parts
          test ! -d supabase/current-state-schema/generated

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tracked direct snapshot
        run: node scripts/closeout/materialize-current-state-schema.mjs

      - name: Install pinned Supabase CLI and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          npm install --prefix tools/pr101-local-e2e --no-audit --no-fund
          cli="$GITHUB_WORKSPACE/tools/pr101-local-e2e/node_modules/.bin/supabase"
          test -x "$cli"
          test "$($cli --version)" = "2.109.1"
          echo "SUPABASE_BIN=$cli" >> "$GITHUB_ENV"

      - name: Build fresh isolated Supabase Local project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCHEMA_WORKDIR"
          mkdir -p "$SCHEMA_WORKDIR/supabase/migrations"
          cp supabase/config.toml "$SCHEMA_WORKDIR/supabase/config.toml"
          printf '%s\n' '-- No fixtures: zero-row schema verification only.' > "$SCHEMA_WORKDIR/supabase/seed.sql"
          "$SUPABASE_BIN" start --help > /tmp/current-state-start-help.txt

      - name: Start fresh Supabase Local
        shell: bash
        run: |
          set -euo pipefail
          cd "$SCHEMA_WORKDIR"
          args=()
          if grep -q -- '--exclude' /tmp/current-state-start-help.txt; then args+=(--exclude studio,imgproxy); fi
          if ! "$SUPABASE_BIN" start "${args[@]}" > /tmp/current-state-supabase-start.log 2>&1; then
            sed -E 's/(sb_(publishable|secret)_[A-Za-z0-9_-]+)/[REDACTED]/g; s#postgresql?://[^[:space:]]+#[REDACTED_DB_URL]#g' /tmp/current-state-supabase-start.log >&2
            exit 1
          fi

      - name: Regression-check and capture masked local-only database URL
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cd "$SCHEMA_WORKDIR"

          parse_db_url_line() {
            local line="$1"
            local value authority hostport
            case "$line" in DB_URL=*) ;; *) return 1 ;; esac
            value="${line#DB_URL=}"
            if [[ "${value:0:1}" == '"' || "${value: -1}" == '"' ]]; then
              [[ "${value:0:1}" == '"' && "${value: -1}" == '"' ]] || return 1
              [[ ${#value} -ge 2 ]] || return 1
              value="${value:1:${#value}-2}"
            fi
            [[ -n "$value" ]] || return 1
            case "$value" in postgresql://*|postgres://*) ;; *) return 1 ;; esac
            authority="${value#*://}"
            authority="${authority%%/*}"
            hostport="${authority##*@}"
            case "$hostport" in 127.0.0.1:54322|localhost:54322) ;; *) return 1 ;; esac
            printf '%s' "$value"
          }

          expected_quoted='postgresql://postgres:local-only@127.0.0.1:54322/postgres'
          expected_unquoted='postgresql://postgres:local-only@localhost:54322/postgres'
          parsed_quoted="$(parse_db_url_line "DB_URL=\"$expected_quoted\"")"
          parsed_unquoted="$(parse_db_url_line "DB_URL=$expected_unquoted")"
          test "$parsed_quoted" = "$expected_quoted"
          test "$parsed_unquoted" = "$expected_unquoted"
          [[ "$parsed_quoted" != *'"' ]]
          [[ "$parsed_unquoted" != *'"' ]]
          if parse_db_url_line 'DB_URL="postgresql://postgres:local-only@127.0.0.1:54322/postgres'; then exit 1; fi
          if parse_db_url_line 'DB_URL=postgresql://postgres:local-only@127.0.0.1:54323/postgres'; then exit 1; fi
          unset expected_quoted expected_unquoted parsed_quoted parsed_unquoted

          "$SUPABASE_BIN" status -o env > /tmp/current-state-supabase.env
          DB_URL_LINE="$(grep -m1 '^DB_URL=' /tmp/current-state-supabase.env)" || { echo "Supabase Local did not report DB_URL" >&2; exit 1; }
          DB_URL="$(parse_db_url_line "$DB_URL_LINE")" || { echo "Supabase Local DB_URL is empty or outside the expected local endpoint" >&2; exit 1; }
          unset DB_URL_LINE
          printf '::add-mask::%s\n' "$DB_URL"
          printf 'DB_URL=%s\n' "$DB_URL" >> "$GITHUB_ENV"
          unset DB_URL

      - name: Build and regression-test dependency-safe temporary snapshot
        shell: bash
        run: |
          set -euo pipefail
          base64 -d <<'GZIP' | gzip -d > /tmp/build-current-state-apply.mjs
          
          GZIP

          node --check /tmp/build-current-state-apply.mjs
          node /tmp/build-current-state-apply.mjs --self-test /tmp/current-state-schema-parser-regression.generated.sql
          {
            printf '%s\n' 'BEGIN;'
            cat /tmp/current-state-schema-parser-regression.generated.sql
            cat <<'SQL'
          INSERT INTO parser_regression.items DEFAULT VALUES;
          SELECT parser_regression.table_dependent('manual');
          DO $assert$
          BEGIN
            IF (SELECT count(*) FROM parser_regression.items) <> 2 THEN
              RAISE EXCEPTION 'dependency-order regression row count failed';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM parser_regression.items WHERE code = 'bootstrap $function$ text') THEN
              RAISE EXCEPTION 'bootstrap default did not execute';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM parser_regression.items WHERE code = 'manual $other$ text') THEN
              RAISE EXCEPTION 'table-dependent function did not execute';
            END IF;
          END
          $assert$;
          SQL
            printf '%s\n' 'ROLLBACK;'
          } > /tmp/current-state-schema-parser-regression.apply.sql
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f /tmp/current-state-schema-parser-regression.apply.sql

          snapshot="$GITHUB_WORKSPACE/supabase/current-state-schema/current-state-schema.sql"
          test "$(wc -c < "$snapshot" | tr -d '[:space:]')" = "496138"
          printf '%s  %s\n' '3b1890376e3cca966b1dce0979dd2ed089f95237e1067febf4f58e8f1bf776f2' "$snapshot" | sha256sum -c -
          test "$(git hash-object "$snapshot")" = "65f45c04f7bd50e7751eb5f802f3ad0550c52bfc"

          node /tmp/build-current-state-apply.mjs "$snapshot" /tmp/current-state-schema.apply.sql
          test -s /tmp/current-state-schema.apply.sql
          grep -q '^-- Phase 1:' /tmp/current-state-schema.apply.sql
          grep -q '^-- Phase 2:' /tmp/current-state-schema.apply.sql
          grep -q '^-- Phase 3:' /tmp/current-state-schema.apply.sql
          grep -q '^-- Phase 4:' /tmp/current-state-schema.apply.sql
          grep -q '^-- Phase 5:' /tmp/current-state-schema.apply.sql
          grep -q '^-- Phase 6:' /tmp/current-state-schema.apply.sql

      - name: Apply dependency-safe temporary snapshot to isolated local database
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f /tmp/current-state-schema.apply.sql

      - name: Prove zero rows before fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            item record;
            row_total bigint;
          BEGIN
            FOR item IN
              SELECT n.nspname, c.relname
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname IN ('public', 'private')
                AND c.relkind IN ('r', 'p')
              ORDER BY n.nspname, c.relname
            LOOP
              EXECUTE format('select count(*) from %I.%I', item.nspname, item.relname) INTO row_total;
              IF row_total <> 0 THEN
                RAISE EXCEPTION 'non-zero business table %.%: % rows', item.nspname, item.relname, row_total;
              END IF;
            END LOOP;
          END
          $verify$;
          SQL

      - name: Verify object inventory
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -At <<'SQL' > /tmp/current-state-inventory.txt
          SELECT 'tables=' || count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private') AND c.relkind IN ('r','p');
          SELECT 'sequences=' || count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private') AND c.relkind='S';
          SELECT 'views=' || count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private') AND c.relkind='v';
          SELECT 'functions=' || count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname IN ('public','private');
          SELECT 'policies=' || count(*) FROM pg_policy p JOIN pg_class c ON c.oid=p.polrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private');
          SQL
          grep -qx 'tables=83' /tmp/current-state-inventory.txt
          grep -qx 'sequences=34' /tmp/current-state-inventory.txt
          grep -qx 'views=6' /tmp/current-state-inventory.txt
          grep -qx 'functions=74' /tmp/current-state-inventory.txt
          grep -qx 'policies=50' /tmp/current-state-inventory.txt

      - name: Prove repository and snapshot remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$GITHUB_WORKSPACE/supabase/current-state-schema/current-state-schema.sql"
          node scripts/closeout/materialize-current-state-schema.mjs
          test "$(wc -c < "$snapshot" | tr -d '[:space:]')" = "496138"
          printf '%s  %s\n' '3b1890376e3cca966b1dce0979dd2ed089f95237e1067febf4f58e8f1bf776f2' "$snapshot" | sha256sum -c -
          test "$(git hash-object "$snapshot")" = "65f45c04f7bd50e7751eb5f802f3ad0550c52bfc"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Always destroy local stack and temporary values
        if: always()
        shell: bash
        run: |
          set +e
          if [ -d "$SCHEMA_WORKDIR" ]; then
            cd "$SCHEMA_WORKDIR"
            "$SUPABASE_BIN" stop --no-backup >/dev/null 2>&1 || true
          fi
          rm -rf "$SCHEMA_WORKDIR"
          rm -f /tmp/current-state-start-help.txt /tmp/current-state-supabase-start.log /tmp/current-state-supabase.env /tmp/current-state-inventory.txt
          rm -f /tmp/build-current-state-apply.mjs /tmp/current-state-schema-parser-regression.generated.sql
          rm -f /tmp/current-state-schema-parser-regression.apply.sql /tmp/current-state-schema.apply.sql
