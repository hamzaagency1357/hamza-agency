name: HAMZA Current-State Schema Verify

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/current-state-schema/**"
      - "supabase/migrations/**"
      - "scripts/closeout/**"
      - "tests/pr1-*.test.mjs"
      - "tests/pr1-runtime-contract.sql"
      - ".github/workflows/current-state-schema-verify.yml"
      - ".github/workflows/hamza-closeout-pr1-runtime.yml"

permissions:
  contents: read

concurrency:
  group: current-state-schema-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-sanitized-snapshot:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact trusted PR Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Assert exact PR Head and Production isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test '${{ github.event.pull_request.base.ref }}' = main
          test '${{ github.event.pull_request.head.repo.full_name }}' = '${{ github.repository }}'
          test '${{ github.actor }}' != 'dependabot[bot]'
          test -z "${HAMZA_PRODUCTION_READONLY_URL:-}"
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test ! -d supabase/current-state-schema/parts
          test ! -d supabase/current-state-schema/generated

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tracked snapshot, manifest, and frozen identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/closeout/materialize-current-state-schema.mjs
          snapshot="$GITHUB_WORKSPACE/supabase/current-state-schema/current-state-schema.sql"
          test "$(wc -c < "$snapshot" | tr -d '[:space:]')" = "496138"
          printf '%s  %s\n' '3b1890376e3cca966b1dce0979dd2ed089f95237e1067febf4f58e8f1bf776f2' "$snapshot" | sha256sum -c -
          test "$(git hash-object "$snapshot")" = "65f45c04f7bd50e7751eb5f802f3ad0550c52bfc"

      - name: Regression-test dependency-safe snapshot parser
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/closeout/build-current-state-apply.part{00,01,02,03} | base64 -d | gzip -d > /tmp/build-current-state-apply.mjs
          node --check /tmp/build-current-state-apply.mjs
          node /tmp/build-current-state-apply.mjs --self-test /tmp/parser-regression.generated.sql
          test -s /tmp/parser-regression.generated.sql
          node /tmp/build-current-state-apply.mjs supabase/current-state-schema/current-state-schema.sql /tmp/current-state-schema.apply.sql
          test -s /tmp/current-state-schema.apply.sql

      - name: Verify migration safety and closeout contracts
        run: |
          npm run verify:migrations
          node --test tests/pr1-production-hardening.test.mjs tests/pr1-closeout-regressions.test.mjs tests/pr1-preview-discovery.test.mjs

      - name: Prove repository and snapshot remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          node scripts/closeout/materialize-current-state-schema.mjs
          test -z "$(git status --porcelain --untracked-files=all)"
          rm -f /tmp/build-current-state-apply.mjs /tmp/parser-regression.generated.sql /tmp/current-state-schema.apply.sql
