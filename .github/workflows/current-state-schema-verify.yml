name: HAMZA Current-State Schema Verify

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/current-state-schema/**"
      - "scripts/closeout/materialize-current-state-schema.mjs"
      - "scripts/closeout/verify-current-state-schema.mjs"
      - "scripts/closeout/run-current-state-schema-owner.sh"
      - ".github/workflows/current-state-schema-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-state-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-sanitized-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: closeout-local-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CURRENT_STATE_SCHEMA_DATABASE_URL: postgresql://postgres:closeout-local-only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client; }
          psql "$CURRENT_STATE_SCHEMA_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'select 1' >/dev/null
      - name: Materialize and verify sanitized schema
        run: node scripts/closeout/materialize-current-state-schema.mjs
      - name: Assert generated output is untracked and schema-only
        shell: bash
        run: |
          set -euo pipefail
          sql="supabase/current-state-schema/generated/current-state-schema.sql"
          test -s "$sql"
          git check-ignore -q "$sql"
          test "$(wc -c < "$sql")" -eq 495401
          test "$(sha256sum "$sql" | cut -d' ' -f1)" = "3b1890376e3cca966b1dce0979dd2ed089f95237e1067febf4f58e8f1bf776f2"
          ! grep -Eiq '^[[:space:]]*(insert[[:space:]]+into|copy)[[:space:]]' "$sql"
          ! grep -Eiq '\b(setval|owner[[:space:]]+to|lo_import|pg_largeobject)\b' "$sql"
          test -z "$(git status --porcelain --untracked-files=all)"
