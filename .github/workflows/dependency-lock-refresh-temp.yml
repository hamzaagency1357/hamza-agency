name: Security Hardening Bootstrap (temporary)

on:
  push:
    branches:
      - fix/dependencies-auth-hardening
    paths:
      - .github/workflows/dependency-lock-refresh-temp.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate dependency lock
        run: node -e "const l=require('./package-lock.json');const p=l.packages;for(const [n,v] of Object.entries({next:'15.5.22',react:'19.2.8','react-dom':'19.2.8',sharp:'0.35.3',postcss:'8.5.26','@playwright/test':'1.62.1'})){if(p['node_modules/'+n]?.version!==v)throw new Error(n)};if(p['node_modules/nanoid']?.version!=='3.3.18')throw new Error('nanoid')"
      - name: Apply exact missing-permission patch
        run: python3 scripts/temp-auth-hardening.py
      - name: Commit Edge fail-closed hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/pr116-admin-oidc-gateway/index.ts
          git diff --cached --check
          git commit -m "security: deny missing admin permission rows"
          git push
