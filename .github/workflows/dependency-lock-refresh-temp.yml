name: Security Hardening Bootstrap (temporary)

on:
  push:
    branches:
      - fix/dependencies-auth-hardening
    paths:
      - .github/workflows/dependency-lock-refresh-temp.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate generated dependency lock
        run: |
          node -e "const l=require('./package-lock.json'); const p=l.packages; const want={next:'15.5.22',react:'19.2.8','react-dom':'19.2.8',sharp:'0.35.3',postcss:'8.5.26','@playwright/test':'1.62.1'}; for (const [n,v] of Object.entries(want)) { const got=p['node_modules/'+n]?.version; if(got!==v) throw new Error(n+': '+got+' != '+v); } const nano=p['node_modules/nanoid']?.version; if(!nano || Number(nano.split('.')[0])!==3 || nano.localeCompare('3.3.18',undefined,{numeric:true})<0) throw new Error('nanoid '+nano+' below 3.3.18 legacy line');"
      - name: Remove legacy email authority fallbacks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block missing: {path}')
              p.write_text(text.replace(old, new))

          replace_exact('lib/adminAccess.ts', '''  if (!data && !queryError && profile.email) {
            const fallback = await supabase
              .from("admin_permissions")
              .select(fields)
              .is("admin_user_id", null)
              .ilike("admin_email", profile.email.trim().toLowerCase())
              .eq("module_key", module)
              .maybeSingle();

            data = fallback.data as Record<string, unknown> | null;
            queryError = fallback.error;
          }

''', '')
          replace_exact('lib/adminAccess.ts', '''  const email = session.user.email?.trim() || "";

          if (!data && !queryError && email) {
            const fallback = await supabase
              .from("admin_users")
              .select(fields)
              .is("user_id", null)
              .ilike("email", email)
              .maybeSingle();

            data = fallback.data;
            queryError = fallback.error;
          }

''', '''  const email = session.user.email?.trim() || "";

''')
          replace_exact('lib/server/adminMutationBoundary.ts', '''  let row = primary.ok && Array.isArray(primary.data) ? primary.data[0] : null;

          if (!row && user.email) {
            const fallback = await supabaseRestAsUser<AdminUserRow[]>(
              `/admin_users?select=${fields}&user_id=is.null&email=ilike.${encodeURIComponent(user.email)}&limit=1`,
              user,
            );
            row = fallback.ok && Array.isArray(fallback.data) ? fallback.data[0] : null;
          }

''', '''  const row = primary.ok && Array.isArray(primary.data) ? primary.data[0] : null;

''')
          replace_exact('lib/server/adminMutationBoundary.ts', '''  let permission = primary.ok && Array.isArray(primary.data) ? primary.data[0] : null;
          if (!permission && actor.profile.email) {
            const fallback = await supabaseRestAsUser<PermissionRow[]>(
              `/admin_permissions?select=${fields}&admin_user_id=is.null&admin_email=ilike.${encodeURIComponent(actor.profile.email)}&module_key=eq.${encodeURIComponent(module)}&limit=1`,
              actor.user,
            );
            permission = fallback.ok && Array.isArray(fallback.data) ? fallback.data[0] : null;
          }

''', '''  const permission = primary.ok && Array.isArray(primary.data) ? primary.data[0] : null;

''')
          replace_exact('lib/server/pr116AdminOidcGateway.ts', '''  const workloadToken = request.headers.get("x-vercel-oidc-token") || process.env.VERCEL_OIDC_TOKEN || "";
''', '''  const workloadToken = process.env.VERCEL_OIDC_TOKEN || "";
''')
          replace_exact('supabase/functions/pr116-admin-oidc-gateway/index.ts', '''  let rows = primary.ok ? await primary.json().catch(() => []) as Record<string, unknown>[] : [];
          let row = rows[0] || null;
          if (!row && user.email) {
            const fallback = await serviceFetch(supabaseUrl, serviceRole, `/admin_users?select=${fields}&user_id=is.null&email=ilike.${encodeURIComponent(user.email)}&limit=1`);
            rows = fallback.ok ? await fallback.json().catch(() => []) as Record<string, unknown>[] : [];
            row = rows[0] || null;
          }
''', '''  const rows = primary.ok ? await primary.json().catch(() => []) as Record<string, unknown>[] : [];
          const row = rows[0] || null;
''')
          replace_exact('supabase/functions/pr116-admin-oidc-gateway/index.ts', '''  let rows = primary.ok ? await primary.json().catch(() => []) as Record<string, unknown>[] : [];
          let row = rows[0] || null;
          if (!row && admin.email) {
            const fallback = await serviceFetch(supabaseUrl, serviceRole, `/admin_permissions?select=${fields}&admin_user_id=is.null&admin_email=ilike.${encodeURIComponent(admin.email)}&module_key=eq.${encodeURIComponent(module)}&limit=1`);
            rows = fallback.ok ? await fallback.json().catch(() => []) as Record<string, unknown>[] : [];
            row = rows[0] || null;
          }
''', '''  const rows = primary.ok ? await primary.json().catch(() => []) as Record<string, unknown>[] : [];
          const row = rows[0] || null;
''')
          PY
      - name: Commit auth boundary hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/adminAccess.ts lib/server/adminMutationBoundary.ts lib/server/pr116AdminOidcGateway.ts supabase/functions/pr116-admin-oidc-gateway/index.ts
          git diff --cached --check
          git commit -m "security: require authoritative admin identities"
          git push
