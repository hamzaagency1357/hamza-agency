name: Dependency Lock Refresh (temporary)

on:
  push:
    branches:
      - fix/dependencies-auth-hardening
    paths:
      - package.json
      - .github/workflows/dependency-lock-refresh-temp.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate exact dependency targets
        run: |
          node -e "const l=require('./package-lock.json'); const p=l.packages; const want={next:'15.5.22',react:'19.2.8','react-dom':'19.2.8',sharp:'0.35.3',postcss:'8.5.26','@playwright/test':'1.62.1'}; for (const [n,v] of Object.entries(want)) { const got=p['node_modules/'+n]?.version; if(got!==v) throw new Error(n+': '+got+' != '+v); } const nano=p['node_modules/nanoid']?.version; if(!nano || Number(nano.split('.')[0])!==3 || nano.localeCompare('3.3.18',undefined,{numeric:true})<0) throw new Error('nanoid '+nano+' below 3.3.18 legacy line');"
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh secure dependency lockfile"
          git push
