name: PR148 Lockfile Sync

on:
  push:
    branches:
      - fix/backup-validation-oidc-closeout
    paths:
      - .github/workflows/pr148-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/backup-validation-oidc-closeout
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr148-lockfile-sync.yml
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes produced"
            exit 1
          fi
          git commit -m "Synchronize PR148 dependency lockfile"
          git push origin HEAD:fix/backup-validation-oidc-closeout
